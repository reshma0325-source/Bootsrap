<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delicious Bites Restaurant</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="Style.css">
</head>
<body>

<!--  NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="#">🍴 Delicious Bites</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="#home">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#menu">Menu</a></li>
        <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
        <button class="btn btn-warning  btn-group-sm data-bs-toggle="modal" data-bs-target="#bookingModal">
      Book a Table
    </button>
      </ul>
    </div>
  </div>
</nav>

<!-- CAROUSEL -->
 <div id="foodCarousel" class="carousel slide mt-5" data-bs-ride="carousel">
  <div class="carousel-inner">

    <div class="carousel-item active">
      <img src="image/Food1.avif" class="d-block w-100" alt="Food 1">
    </div>

    <div class="carousel-item">
      <img src="image/Food-2.jpg" class="d-block w-100" alt="Food 2">
    </div>

    <div class="carousel-item">
      <img src="image/Food3.webp" class="d-block w-100" alt="Food 3">
    </div>
  </div>

  <button class="carousel-control-prev" type="button" data-bs-target="#foodCarousel" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#foodCarousel" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>

<!--  MENU CARDS  -->
<section id="menu" class="py-5">
  <div class="container">
    <h2 class="text-center mb-4">Our Special Menu</h2>
    <div class="row">

      <div class="col-md-4 mb-4">
        <div class="card shadow">
          <img src="image/pizza-3010062_1280.jpg" class="card-img-top">
          <div class="card-body text-center">
            <h5 class="card-title">Italian Pizza</h5>
            <p class="card-text">Delicious cheesy pizza.</p>
            <button class="btn btn-dark">Order Now</button>
          </div>
        </div>
      </div>

      <div class="col-md-4 mb-4">
        <div class="card shadow">
          <img src="image/Classic Burger.jpg" class="card-img-top">
          <div class="card-body text-center">
            <h5 class="card-title">Classic Burger</h5>
            <p class="card-text">Juicy grilled burger.</p>
            <button class="btn btn-dark">Order Now</button>
          </div>
        </div>
      </div>

      <div class="col-md-4 mb-4">
        <div class="card shadow">
          <img src="image/Creamy Pasta.avif" class="card-img-top" height="200px">
          <div class="card-body text-center">
            <h5 class="card-title">Creamy Pasta</h5>
            <p class="card-text">Rich creamy pasta.</p>
            <button class="btn btn-dark">Order Now</button>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- CONTACT FORM -->
<section id="contact" class="bg-light py-5">
  <div class="container">
    <h2 class="text-center mb-4">Contact Us</h2>
    <form id="contactForm" class="row g-3">

      <div class="col-md-6">
        <input type="text" class="form-control" placeholder="Your Name" required>
      </div>

      <div class="col-md-6">
        <input type="email" class="form-control" placeholder="Your Email" required>
      </div>

      <div class="col-12">
        <textarea class="form-control" rows="4" placeholder="Message" required></textarea>
      </div>

      <div class="col-12 text-center">
        <button type="submit" class="btn btn-warning">Send Message</button>
      </div>

    </form>
  </div>
</section>

<!--  MODAL  -->
<div class="modal fade" id="bookingModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Book a Table</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="text" class="form-control mb-2" placeholder="Your Name">
        <input type="date" class="form-control mb-2">
        <input type="time" class="form-control">
      </div>
      <div class="modal-footer">
        <button class="btn btn-success">Confirm Booking</button>
      </div>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center p-3">
  <p class="mb-0">© 2026 Delicious Bites Restaurant | All Rights Reserved</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->
<script src="Script.js"></script>

</body>
</html>
